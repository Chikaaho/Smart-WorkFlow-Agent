name: Publish sw-agent npm package

on:
  push:
    tags:
      - 'sw-agent-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack without publishing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Build package
        run: npm --prefix npm/sw-agent run build

      - name: Verify package entry
        run: npm --prefix npm/sw-agent run smoke

      - name: Verify packed installation
        run: npm run check:sw-agent-package

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/sw-agent-v')
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./npm/sw-agent/package.json').version")
          tag_version=${TAG_VERSION#sw-agent-v}
          test "$package_version" = "$tag_version"

      - name: Preview package
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        working-directory: npm/sw-agent
        run: npm pack --dry-run --ignore-scripts

      - name: Publish package
        if: github.event_name == 'push' || !inputs.dry_run
        working-directory: npm/sw-agent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --ignore-scripts
